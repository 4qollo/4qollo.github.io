<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeIT - GitHub Code Highlighter</title>
    
    <!-- Lightweight mobile styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #f4f4f4;
            padding: 15px;
            margin: 0;
        }
        h2 { text-align: center; color: #4caf50; margin-top: 10px; }
        .container { max-width: 600px; margin: auto; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #444;
            font-size: 16px; /* Prevents auto-zoom on mobile inputs */
        }
        input { background-color: #2d2d2d; color: #fff; }
        button { background-color: #4caf50; color: white; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background-color: #45a049; }
        .error { color: #ff6b6b; font-weight: bold; margin-bottom: 10px; }
        pre {
            background: #272822;
            padding: 12px;
            overflow-x: auto;
            border-radius: 4px;
            border: 1px solid #3e3e3e;
            font-size: 14px;
        }
    </style>

    <!-- PrismJS Theme for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

<div class="container">
    <h2>CodeIT Highlighter</h2>
    <p style="text-align:center; font-size:13px; color:#aaa;">Enter a direct public GitHub file link below</p>
    
    <input type="text" id="repoUrl" placeholder="https://github.com">
    <button onclick="fetchGitHubCode()">Fetch & Color Code</button>
    
    <div id="errorMessage" class="error"></div>
    
    <!-- Code display area -->
    <pre><code id="codeDisplay" class="language-javascript">// Your highlighted code will appear here...</code></pre>
</div>

<!-- PrismJS core script for coloring -->
<script src="https://cloudflare.com"></script>
<!-- PrismJS autoloader to automatically recognize languages like HTML, CSS, JS, Python, etc. -->
<script src="https://cloudflare.com"></script>

<script>
async function fetchGitHubCode() {
    const urlInput = document.getElementById('repoUrl').value.trim();
    const codeDisplay = document.getElementById('codeDisplay');
    const errorMessage = document.getElementById('errorMessage');
    
    // Clear previous outputs
    errorMessage.textContent = "";
    codeDisplay.textContent = "Loading file from GitHub...";
    Prism.highlightElement(codeDisplay);

    if (!urlInput) {
        errorMessage.textContent = "Please enter a valid URL.";
        codeDisplay.textContent = "";
        return;
    }

    try {
        // Convert a regular GitHub web URL into a raw content URL
        // Example: ://github.com -> ://githubusercontent.com
        let rawUrl = urlInput
            .replace('github.com', '://githubusercontent.com')
            .replace('/blob/', '/');

        const response = await fetch(rawUrl);
        
        if (!response.ok) {
            throw new Error("Could not fetch the file. Check if the link is correct and public.");
        }

        const codeText = await response.text();
        
        // Try to guess the file language extension (e.g., html, css, js)
        const fileExtension = urlInput.split('.').pop().toLowerCase();
        
        // Dynamically change the class name so Prism knows what language to color
        codeDisplay.className = `language-${fileExtension}`;
        codeDisplay.textContent = codeText;
        
        // Trigger Prism to re-highlight the updated content
        Prism.highlightElement(codeDisplay);

    } catch (error) {
        errorMessage.textContent = error.message;
        codeDisplay.textContent = "// Error loading file.";
        Prism.highlightElement(codeDisplay);
    }
}
</script>

</body>
</html>
